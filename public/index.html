<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest.json">
  <title>School Among Us</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #111; color: white; padding: 15px; margin: 0; text-align: center; }
    .card { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    input[type="text"] {
      width: 100%; padding: 14px; margin-bottom: 10px; font-size: 16px;
      border: 1px solid #444; background: #333; color: #fff; border-radius: 8px; outline: none;
    }
    button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-red { background: #e74c3c; color: white; }
    .btn-orange { background: #e67e22; color: white; }
    .btn-blue { background: #3498db; color: white; }
    .btn-green { background: #2ecc71; color: white; }
    .hidden { display: none !important; pointer-events: none !important; }
    .task-box {
      background: #2a2a2a; border-left: 5px solid #3498db; padding: 12px; margin: 8px 0;
      border-radius: 6px; text-align: left; display: flex; justify-content: space-between; align-items: center;
    }
    .task-box.done { border-left-color: #2ecc71; opacity: 0.5; text-decoration: line-through; }
    .notification-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 1000; animation: flash 0.5s infinite alternate;
    }
    @keyframes flash { from { opacity: 1; } to { opacity: 0.7; } }
  </style>
</head>
<body>

  <div id="overlay" class="notification-screen hidden">
    <h1 id="overlay-title" style="font-size: 2.5rem; margin:0;"></h1>
    <h3 id="overlay-desc"></h3>
  </div>

  <h1>📱 Among Us (School Edition)</h1>

  <!-- LOBBY -->
  <div id="sec-lobby" class="card">
    <input type="text" id="p-name" placeholder="Enter Your Name" autocomplete="off">
    <button class="btn-blue" onclick="joinGame()">Join Lobby</button>

    <div id="lobby-status" style="margin: 10px 0; color: #aaa;">Joined Players: <span id="player-count">0</span></div>

    <hr style="border-color:#333; margin:15px 0;">
    <h3>Add Custom School Task</h3>
    <input type="text" id="new-task" placeholder="e.g., Clean Lab Desk 3" autocomplete="off">
    <button class="btn-blue" onclick="createTask()">+ Add Task</button>
    
    <button class="btn-red" style="margin-top:15px;" onclick="startGame()">▶️ START GAME</button>
  </div>

  <!-- GAMEPLAY INTERFACE -->
  <div id="sec-play" class="card hidden">
    <h2 id="role-text"></h2>
    
    <!-- Impostor Controls -->
    <div id="impostor-panel" class="hidden">
      <h3 style="color:#e74c3c;">Kill Target</h3>
      <div id="kill-buttons"></div>
    </div>

    <!-- Crewmate Dynamic Tasks -->
    <div id="tasks-panel">
      <h3>Your Tasks</h3>
      <div id="my-task-list"></div>
    </div>

    <hr style="border-color:#333; margin:15px 0;">
    <div id="reported-bodies-panel"></div>
    <button class="btn-orange" onclick="callEmergency()">🔔 CALL EMERGENCY MEETING</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myId = null;

    if ("Notification" in window) { Notification.requestPermission(); }

    socket.on('connect', () => { myId = socket.id; });

    function joinGame() {
      const name = document.getElementById('p-name').value;
      if (name) {
        socket.emit('joinGame', name);
        document.getElementById('p-name').disabled = true;
      }
    }

    function createTask() {
      const input = document.getElementById('new-task');
      if (input.value) {
        socket.emit('addTask', input.value);
        input.value = '';
      }
    }

    function startGame() { socket.emit('startGame'); }
    function callEmergency() { socket.emit('callEmergencyMeeting'); }
    function reportBody(victimName) { socket.emit('reportDeadBody', victimName); }
    function kill(id) { socket.emit('killPlayer', id); }
    function completeTask(idx) { socket.emit('completeTask', idx); }

    socket.on('gameStartError', (msg) => { alert(msg); });

    socket.on('notifyBodyFound', (data) => {
      triggerAlarm({
        title: "🩸 DEAD BODY REPORTED!",
        desc: `${data.reporter} found ${data.victim}'s body!`,
        bgColor: "#900C3F",
        vibratePattern: [500, 100, 500, 100, 500],
        soundPitch: 300
      });
    });

    socket.on('notifyEmergencyMeeting', (data) => {
      triggerAlarm({
        title: "🚨 EMERGENCY MEETING!",
        desc: `${data.caller} called a meeting!`,
        bgColor: "#d35400",
        vibratePattern: [1000, 200, 1000],
        soundPitch: 600
      });
    });

    function triggerAlarm(config) {
      const overlay = document.getElementById('overlay');
      document.getElementById('overlay-title').innerText = config.title;
      document.getElementById('overlay-desc').innerText = config.desc;
      overlay.style.backgroundColor = config.bgColor;
      overlay.classList.remove('hidden');

      if ("vibrate" in navigator) { navigator.vibrate(config.vibratePattern); }
      if (Notification.permission === "granted") { new Notification(config.title, { body: config.desc }); }

      playAudioAlarm(config.soundPitch);

      setTimeout(() => { overlay.classList.add('hidden'); }, 3500);
    }

    function playAudioAlarm(pitch) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(pitch, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 1.5);
      } catch(e) {}
    }

    socket.on('gameStarted', () => {
      document.getElementById('sec-lobby').classList.add('hidden');
      document.getElementById('sec-play').classList.remove('hidden');
    });

    socket.on('youDied', () => {
      alert("You were killed! You are now a silent ghost.");
      document.body.style.filter = "grayscale(100%)";
    });

    socket.on('stateUpdate', (state) => {
      document.getElementById('player-count').innerText = state.players.length;

      if (state.status === 'LOBBY') {
        document.getElementById('sec-lobby').classList.remove('hidden');
        document.getElementById('sec-play').classList.add('hidden');
        return;
      }

      const me = state.players.find(p => p.id === myId);
      if (!me) return;

      const roleBanner = document.getElementById('role-text');
      roleBanner.innerText = `Role: ${me.role}`;
      roleBanner.style.color = (me.role === 'Impostor') ? '#e74c3c' : '#3498db';

      // Impostor Controls
      if (me.role === 'Impostor') {
        document.getElementById('impostor-panel').classList.remove('hidden');
        document.getElementById('tasks-panel').classList.add('hidden');
        document.getElementById('kill-buttons').innerHTML = state.players
          .filter(p => p.id !== myId && p.alive)
          .map(p => `<button class="btn-red" onclick="kill('${p.id}')">Kill ${p.name}</button>`).join('');
      } else {
        // Crewmate Tasks UI
        document.getElementById('impostor-panel').classList.add('hidden');
        document.getElementById('tasks-panel').classList.remove('hidden');

        const taskListDiv = document.getElementById('my-task-list');
        taskListDiv.innerHTML = me.tasks.map((t, idx) => `
          <div class="task-box ${t.done ? 'done' : ''}">
            <span>${t.text}</span>
            ${!t.done ? `<button class="btn-green" style="width:auto; padding:6px 12px; margin:0;" onclick="completeTask(${idx})">Done</button>` : '<span>✓</span>'}
          </div>
        `).join('');
      }

      // Render Dead Bodies Available to Report
      const bodyPanel = document.getElementById('reported-bodies-panel');
      if (state.deadBodies.length > 0) {
        bodyPanel.innerHTML = state.deadBodies
          .map(b => `<button class="btn-red" onclick="reportBody('${b.name}')">REPORT ${b.name}'s BODY</button>`).join('');
      } else {
        bodyPanel.innerHTML = '';
      }
    });
  </script>
</body>
</html>
