<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IRL Among Us - Host Master Console</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0c; color: #fff; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .card { background: #16161a; border: 1px solid #282830; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h1, h2, h3 { margin-top: 0; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: bold; text-transform: uppercase; font-size: 14px; }
    .status-LOBBY { background: #2980b9; }
    .status-PLAYING { background: #27ae60; }
    .status-MEETING { background: #c0392b; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.6; } }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #282830; }
    th { color: #888; text-transform: uppercase; font-size: 12px; }
    .alive { color: #2ecc71; font-weight: bold; }
    .dead { color: #e74c3c; text-decoration: line-through; opacity: 0.6; }
    .role-Impostor { color: #e74c3c; font-weight: bold; }
    .role-Crewmate { color: #3498db; }
    button { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; margin-right: 10px; }
    .btn-green { background: #2ecc71; color: white; }
    .btn-orange { background: #e67e22; color: white; }
    .btn-red { background: #e74c3c; color: white; }
    .progress-bar { background: #333; height: 16px; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    .progress-fill { background: #2ecc71; height: 100%; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1>🖥️ Host Master Control Station</h1>
    <div>
      <span id="game-status" class="status-badge status-LOBBY">LOBBY</span>
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Live Players & Roles</h2>
        <table>
          <thead>
            <tr>
              <th>Player Name</th>
              <th>Status</th>
              <th>Role (Host Vision)</th>
              <th>Tasks Complete</th>
            </tr>
          </thead>
          <tbody id="player-table"></tbody>
        </table>
      </div>

      <div class="card" style="margin-top: 20px;">
        <h2>Total Crewmate Task Progress</h2>
        <div class="progress-bar">
          <div id="task-progress" class="progress-fill"></div>
        </div>
        <p id="task-stats" style="color: #888; font-size: 14px; margin-top: 5px;">0/0 Tasks Completed</p>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Master Game Controls</h2>
        <button class="btn-green" style="width:100%; margin-bottom:10px;" onclick="startGame()">▶️ START GAME</button>
        <button class="btn-orange" style="width:100%; margin-bottom:10px;" onclick="forceMeeting()">🔔 FORCE EMERGENCY MEETING</button>
        <button class="btn-red" style="width:100%;" onclick="endGame()">⏹️ RESET GAME TO LOBBY</button>
      </div>

      <div class="card" style="margin-top: 20px;">
        <h2>Global Task Pool</h2>
        <input type="text" id="host-task" placeholder="Add school task..." style="width:70%; padding:10px; background:#222; border:1px solid #444; color:white; border-radius:6px;">
        <button class="btn-green" onclick="addHostTask()">Add</button>
        <ul id="host-task-list" style="padding-left:20px; font-size:14px; color:#ccc;"></ul>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('connect', () => {
      socket.emit('getTasks');
    });

    socket.on('tasksUpdated', (tasks) => {
      document.getElementById('host-task-list').innerHTML = tasks.map(t => `<li>${t}</li>`).join('');
    });

    function startGame() { socket.emit('startGame'); }
    function forceMeeting() { socket.emit('hostForceMeeting'); }
    function endGame() { socket.emit('hostEndGame'); }
    function addHostTask() {
      const input = document.getElementById('host-task');
      if (input.value) {
        socket.emit('addTask', input.value);
        input.value = '';
      }
    }

    socket.on('stateUpdate', (state) => {
      const statusBadge = document.getElementById('game-status');
      statusBadge.innerText = state.status;
      statusBadge.className = `status-badge status-${state.status}`;

      const tbody = document.getElementById('player-table');
      tbody.innerHTML = '';

      let totalTasks = 0;
      let completedTasks = 0;

      state.players.forEach(p => {
        let taskCount = 0;
        let taskDone = 0;

        if (p.tasks) {
          p.tasks.forEach(t => {
            totalTasks++;
            taskCount++;
            if (t.done) {
              completedTasks++;
              taskDone++;
            }
          });
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${p.name}</td>
          <td class="${p.alive ? 'alive' : 'dead'}">${p.alive ? 'ALIVE' : 'ELIMINATED'}</td>
          <td class="role-${p.role}">${p.role}</td>
          <td>${p.role === 'Crewmate' ? `${taskDone}/${taskCount}` : 'N/A (Impostor)'}</td>
        `;
        tbody.appendChild(tr);
      });

      // Update progress bar
      const pct = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
      document.getElementById('task-progress').style.width = `${pct}%`;
      document.getElementById('task-stats').innerText = `${completedTasks}/${totalTasks} Tasks Completed (${pct}%)`;
    });
  </script>
</body>
</html>
